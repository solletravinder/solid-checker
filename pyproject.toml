[project]
name = "solid-checker"
version = "0.1.0"
description = "SOLID principle checker for codebases"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "anthropic>=0.39",
    "tree-sitter>=0.20",
    "tree-sitter-python>=0.20",
    "tree-sitter-javascript>=0.20",
]

[project.scripts]
solid-checker = "solid_checker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
